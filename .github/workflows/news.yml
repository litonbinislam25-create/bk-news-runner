name: news-bot
# Telegram group -> banglarkhabor24.com, code only (no AI).
# Each job checks Telegram every 30 s for 55 min, then starts the next job itself, so there is
# no gap. The schedule below only restarts the chain if it ever breaks (GitHub runs it late).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_draft:
        description: "1 = test run: posts stay drafts, nobody is messaged"
        default: "0"
concurrency:
  group: news-bot
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/telegram.json
            state/schedule.json
            inbox
            done
            logs
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - run: pip install -q pillow anthropic "opencv-python-headless<5"
      - name: Fetch and publish
        env:
          BOT_SECRETS: ${{ secrets.BOT_SECRETS }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_DRAFT: ${{ github.event.inputs.force_draft || '0' }}
          LOOP_MINUTES: "55"
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/auto_run.py; s=$?; tail -5 logs/run.log 2>/dev/null || true; exit $s
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/telegram.json
            state/schedule.json
            inbox
            done
            logs
          key: bot-state-${{ github.run_id }}
      - name: Keep the schedule alive (GitHub stops idle schedules after 60 days)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H%M | cut -c1-5)" = "01000" ]; then
            date -u > .keepalive && git config user.name news-bot && git config user.email news-bot@users.noreply.github.com
            git add .keepalive && git commit -m "keepalive" && git push
          fi
      - name: Start the next job right away (no gap between jobs)
        if: always() && github.event.inputs.force_draft != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          on=$(python3 -c "import json;print(json.load(open('config.json')).get('runner_enabled', False))")
          [ "$on" = "True" ] || { echo "runner disabled"; exit 0; }
          waiting=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/news.yml/runs?status=queued&per_page=5" --jq '.total_count' || echo 0)
          pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/news.yml/runs?status=pending&per_page=5" --jq '.total_count' || echo 0)
          if [ "$waiting" != "0" ] || [ "$pending" != "0" ]; then echo "next job already waiting"; exit 0; fi
          gh workflow run news.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
